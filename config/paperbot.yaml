# =====================================================================
# paperbot — configuration (PAPER TRADING ONLY)
# =====================================================================
# All tuneable parameters live here. Secrets (ANTHROPIC_API_KEY) come
# from the environment only — never put them in this file.
#
# There is deliberately NO setting for wallets, private keys or live
# trading. The bot refuses to start unless PAPER_MODE=true.
# =====================================================================

starting_capital_usd: 1000.0          # VIRTUAL money
database_path: data/paperbot.sqlite

api:
  gamma_base: "https://gamma-api.polymarket.com"   # public market metadata
  clob_base: "https://clob.polymarket.com"         # public order books (read-only)
  timeout_s: 10
  min_interval_s: 0.25                # client-side throttle between requests
  max_retries: 3                      # on 429 / 5xx / connection errors
  max_backoff_s: 30
  user_agent: "paperbot/0.1 (paper-trading research; read-only)"

scanner:
  max_markets: 400                    # markets pulled from Gamma per run
  page_size: 100
  min_liquidity_usd: 5000
  min_volume_24h_usd: 1000
  max_books_per_run: 60               # markets whose full order books we fetch
  snapshot_levels: 5                  # order-book levels stored per side
  snapshot_retention_days: 14         # older raw market/book snapshots are pruned

fees:
  # Taker fee = shares * rate * p * (1 - p). Makers pay 0.
  # Rates per category from docs.polymarket.com (fees / maker-rebates pages),
  # checked 2026-10-14. Re-check periodically: Polymarket changes these.
  category_rates:
    crypto: 0.07
    sports: 0.05
    finance: 0.04
    politics: 0.04
    economics: 0.05
    culture: 0.05
    tech: 0.04
    geopolitics: 0.0
    other: 0.05
  # When a market's category cannot be determined, assume the HIGHEST rate.
  unknown_category_rate: 0.07

arbitrage:
  min_net_edge_pct: 0.01              # net profit / cost after fees, >= 1%
  min_net_profit_usd: 0.50
  max_trade_usd: 50.0                 # per opportunity (risk engine also caps)
  depth_participation: 0.5            # assume we only get 50% of displayed size
  slippage_buffer: 0.003              # extra $/share-pair safety margin
  max_days_to_resolution: 90          # capital lock-up limit

research:
  enabled: false                      # PAID (Claude API). Off until approved.
  model: "claude-opus-5-5"
  effort: "low"
  max_tokens: 4000
  max_web_searches: 3                 # per market analysed
  min_days_to_resolution: 7           # only slower-moving markets
  max_markets_per_run: 1
  max_calls_per_day: 2
  recheck_hours: 72                   # don't re-research a market sooner
  min_edge: 0.05                      # p_model - executable price, after fees
  min_confidence: 0.6
  kelly_fraction: 0.25
  max_trade_usd: 40.0
  min_evidence_items: 2

budget:
  monthly_ai_cap_usd: 10.0            # HARD cap. AI calls stop when reached.
  web_search_usd_per_search: 0.01     # $10 / 1,000 searches
  # Assumed input tokens added per web search, used for the worst-case
  # pre-authorisation estimate (deliberately generous).
  est_input_tokens_per_search: 25000
  est_prompt_tokens: 3000
  pricing_usd_per_mtok:               # [input, output]
    claude-opus-5-5: [4.0, 20.0]
    claude-sonnet-5-5: [2.0, 10.0]
    claude-haiku-5-5: [0.10, 0.50]
  unknown_model_pricing: [10.0, 50.0] # conservative fallback

risk:
  max_position_pct: 0.05              # max cost of one new position vs equity
  max_total_exposure_pct: 0.50        # all open positions vs equity
  max_per_market_pct: 0.08
  max_open_positions: 10
  min_trade_usd: 5.0
  min_cash_reserve_pct: 0.20
  max_spread: 0.05                    # research trades: best ask - best bid
  max_quote_age_s: 30                 # order book must be this fresh
  daily_loss_limit_pct: 0.03          # stop new entries for the UTC day
  max_drawdown_pct: 0.15              # halt new entries (manual reset needed)
  max_trades_per_day: 10
  min_hours_to_resolution: 2
  stop_loss_pct: 0.35                 # research positions, on liquidation value

execution:
  latency_s: 1.0                      # delay between decision and "order"
  limit_slippage_pct: 0.02            # never pay > signal price * (1 + this)
  depth_participation: 0.5
  random_reject_rate: 0.02            # simulated exchange/order rejections
  unwind_unhedged: true               # arbitrage: sell the orphan leg
